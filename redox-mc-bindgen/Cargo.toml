[package]
name = "redox-mc-bindgen"
version = "0.1.0"
edition = "2021"

[lib]
name = "redox_mc_bindgen"
path = "src/lib.rs"

[[bin]]
name = "redox-mc-bindgen"
path = "src/main.rs"

[dependencies]
ristretto_classfile = "0.34.0"
zip = { version = "2.6", default-features = false, features = ["deflate"] }
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
jvmti-bindings = "3.0.2"
