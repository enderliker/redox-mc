[package]
name = "redox-mc-loader"
version = "0.1.0"
edition = "2021"

[lib]
name = "redox_mc_loader"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "jni-bench"
path = "src/bench/main.rs"

[dependencies]
jvmti-bindings = "3.0.2"
ristretto_classfile = "0.34.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
semver = { version = "1.0", features = ["serde"] }
libloading = "0.9"
arc-swap = "1.7"
redox-mc-adapter-api = { path = "../redox-mc-adapter-api" }
redox-mc-adapter-26-3 = { path = "../redox-mc-adapter-26-3", optional = true }
redox-mc-abi = { path = "../redox-mc-abi" }
sha2 = "0.11.1"


[features]
default = ["mc-26-3"]
mc-26-3 = ["dep:redox-mc-adapter-26-3"]


