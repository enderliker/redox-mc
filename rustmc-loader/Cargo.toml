[package]
name = "rustmc-loader"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
jvmti-bindings = "3.0.2"
rustmc-adapter-api = { path = "../rustmc-adapter-api" }
rustmc-adapter-26-3 = { path = "../rustmc-adapter-26-3", optional = true }

[features]
default = ["mc-26-3"]
mc-26-3 = ["dep:rustmc-adapter-26-3"]
